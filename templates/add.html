{% extends 'base.html' %}{% block title %}Add a piece{% endblock %}{% block content %}<section class="formpage"><a class="underlink" href="{{url_for('wardrobe')}}">← Back to my closet</a><span class="eyebrow">NEW PIECE, WHO DIS? ✳</span><h1>Add to your <span>closet.</span></h1><p>Every little detail helps you remember what you already own.</p><form class="formcard" method="post"><label>Item name *<input name="name" required placeholder="e.g. Blue oversized shirt"></label><label>Category *<select name="category" required><option value="">Choose category</option>{% for c in categories %}<option>{{c}}</option>{% endfor %}</select></label><label>Color *<select name="color" required><option value="">Choose color</option>{% for c in colors %}<option>{{c}}</option>{% endfor %}</select></label><label>Season<select name="season">{% for s in seasons %}<option>{{s}}</option>{% endfor %}</select></label><label>Best for<select name="occasion">{% for o in occasions %}<option>{{o}}</option>{% endfor %}</select></label><label>Size<input name="size" placeholder="S / M / 28 / 7"></label><label>Purchase price (₹)<input name="price" type="number" min="0" value="0"></label><label>Purchase date<input name="purchase_date" type="date"></label><label class="span2">Notes<textarea name="notes" rows="3" placeholder="Fit, fabric, styling ideas…"></textarea></label><button class="btn btn-dark span2">Save to my closet ✦</button><p class="span2 privacy-note">🔐 Your wardrobe is associated with your account.</p></form></section>{% endblock %}
